name: Auto Release
# Auto-create a release when versionName changes in build.gradle.kts

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # MUST NOT cancel in-progress runs: check-version pushes the release tag, then
  # the build/release jobs run for tens of minutes. Cancelling mid-run leaves an
  # orphaned tag whose release is never made, and every later run skips it because
  # the tag already exists. Queue instead — queued runs cheaply no-op once the
  # first one has created the tag and the release.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: 'ubuntu-24.04'
    environment: Primary
    timeout-minutes: 10
    outputs:
      NEW_VERSION: ${{ steps.check.outputs.NEW_VERSION }}
      VERSION_TAG: ${{ steps.version.outputs.TAG }}
    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Only the tip is needed: the version lives in build.gradle.kts at HEAD
          # and tag existence is checked against the remote, not local refs.
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*["'\'']\K[^"'\''"]+' app/build.gradle.kts || true)
          if [ -z "$version_name" ]; then
            echo "Failed to extract versionName from app/build.gradle.kts"
            grep -n "versionName" app/build.gradle.kts || true
            exit 1
          fi
          echo "VERSION=$version_name"
          echo "VERSION=$version_name" >> $GITHUB_OUTPUT

          tag_name="v$version_name"
          echo "TAG=$tag_name"
          echo "TAG=$tag_name" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          # ls-remote checks the remote so a shallow clone (fetch-depth: 1) can't
          # miss a tag created by an earlier run.
          if git ls-remote --tags origin "${{ steps.version.outputs.TAG }}" | grep -q .; then
            echo "NEW_VERSION=false"
            echo "NEW_VERSION=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.TAG }} already exists. Skipping."
          else
            echo "NEW_VERSION=true"
            echo "NEW_VERSION=true" >> $GITHUB_OUTPUT
            echo "New version detected: ${{ steps.version.outputs.TAG }}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${{ steps.version.outputs.TAG }}" -m "Release ${{ steps.version.outputs.TAG }}"
            git push origin "${{ steps.version.outputs.TAG }}"
            echo "Created and pushed tag: ${{ steps.version.outputs.TAG }}"
          fi

  prepare-build:
    name: Prepare build metadata
    runs-on: 'ubuntu-24.04'
    needs: check-version
    if: needs.check-version.outputs.NEW_VERSION == 'true'
    timeout-minutes: 15
    outputs:
      VERSION_TAG: ${{ steps.version.outputs.TAG }}
      CURRENT_SHA: ${{ steps.current_commit.outputs.CURRENT_SHA }}
      PREV_RELEASE_SHA: ${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}
      COMMIT_LOGS: ${{ steps.commit_logs.outputs.COMMIT_LOGS }}
      PREV_TAG_NAME: ${{ steps.previous_commit.outputs.PREV_TAG_NAME }}
      TODO_COMPLETED: ${{ steps.todo_checklist.outputs.COMPLETED }}
      TODO_OPEN: ${{ steps.todo_checklist.outputs.OPEN }}
    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Version info
        id: version
        run: |
          echo "TAG=${{ needs.check-version.outputs.VERSION_TAG }}"
          echo "TAG=${{ needs.check-version.outputs.VERSION_TAG }}" >> $GITHUB_OUTPUT

      - name: Get previous release
        id: last_release
        uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
        with:
          myToken: ${{ github.token }}
          exclude_types: "draft|prerelease"
          view_top: 1

      - name: Current commit
        id: current_commit
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse --short HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          echo "CURRENT_SHA=$current_sha"
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_OUTPUT

      - name: Previous commit
        id: previous_commit
        run: |
          set -e
          tag="${{ steps.last_release.outputs.tag_name }}"
          if [ -z "$tag" ]; then
            echo "No previous release; using root commit as base"
            commit_count_diff=$(git rev-list --count HEAD)
            commit_count_diff=$((commit_count_diff > 0 ? commit_count_diff - 1 : 1))
            prev_release_sha=$(git rev-list --max-parents=0 HEAD | head -n1 | xargs git rev-parse --short)
          else
            commit_count_diff=$(git rev-list --count "$tag"..HEAD || echo 1)
            if [ -z "$commit_count_diff" ] || [ "$commit_count_diff" -eq 0 ]; then
              commit_count_diff=1
            fi
            total=$(git rev-list --count HEAD)
            if [ "$commit_count_diff" -ge "$total" ]; then
              prev_release_sha=$(git rev-list --max-parents=0 HEAD | head -n1 | xargs git rev-parse --short)
            else
              prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
            fi
          fi
          echo "commit_count_diff=$commit_count_diff"
          echo "PREV_RELEASE_SHA=$prev_release_sha"
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_OUTPUT
          echo "PREV_TAG_NAME=$tag"
          echo "PREV_TAG_NAME=$tag" >> $GITHUB_OUTPUT

      - name: TODO checklist since last release
        id: todo_checklist
        env:
          PREV_TAG_NAME: ${{ steps.previous_commit.outputs.PREV_TAG_NAME }}
        run: python3 .github/scripts/todo_release_checklist.py --gh-output

      - name: Commit logs
        id: commit_logs
        run: |
          # Skip commits that only touch TODO files so they don't flood release notes
          echo "COMMIT_LOGS<<{delimiter}
          $(git log --no-merges --pretty=format:"%H|%an|%s" "${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}..${{ steps.current_commit.outputs.CURRENT_SHA }}" \
            | while IFS='|' read -r hash author subject; do
                if git diff-tree --no-commit-id --name-only -r "$hash" < /dev/null | grep -qviE '^(todo\.md|docs/todo\.md)$'; then
                  printf -- "- %s (@%s)\n" "$subject" "$author"
                fi
              done)
          {delimiter}" >> $GITHUB_OUTPUT

  build-app:
    name: Build release app
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    environment: Primary
    timeout-minutes: 90
    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printenv GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set; skipping"
          fi

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            printenv GOOGLE_CLIENT_SECRETS_JSON | base64 -d > app/src/main/assets/client_secrets.json
          else
            echo "GOOGLE_CLIENT_SECRETS_JSON not set; skipping"
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Bundle MLC-LLM runtime
        env:
          MLCL4J_RELEASE_URL: ${{ secrets.MLCL4J_RELEASE_URL }}
        run: bash .github/scripts/bundle_mlc4j.sh

      - name: Build app
        run: ./gradlew assembleMtlRelease assembleNomtlRelease -Pinclude-telemetry -Penable-updater

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/mtl/release

  release-app:
    name: Sign and release
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/mtl/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Sign nomtl APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/nomtl/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APKs
        run: |
          set -e
          mv app/build/outputs/apk/mtl/release/app-mtl-universal-release-unsigned-signed.apk Houri-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/mtl/release/app-mtl-arm64-v8a-release-unsigned-signed.apk Houri-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/mtl/release/app-mtl-armeabi-v7a-release-unsigned-signed.apk Houri-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/mtl/release/app-mtl-x86-release-unsigned-signed.apk Houri-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/mtl/release/app-mtl-x86_64-release-unsigned-signed.apk Houri-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/nomtl/release/app-nomtl-universal-release-unsigned-signed.apk Houri-nomtl-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/nomtl/release/app-nomtl-arm64-v8a-release-unsigned-signed.apk Houri-nomtl-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          mv app/build/outputs/apk/nomtl/release/app-nomtl-armeabi-v7a-release-unsigned-signed.apk Houri-nomtl-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare-build.outputs.VERSION_TAG }}
          name: Houri ${{ needs.prepare-build.outputs.VERSION_TAG }}
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ needs.prepare-build.outputs.VERSION_TAG }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/${{ github.repository }}/releases/${{ needs.prepare-build.outputs.VERSION_TAG }})
            #### What's Changed
            ##### New

            ##### Improve

            ##### Fix

            ${{ needs.prepare-build.outputs.COMMIT_LOGS }}

            ##### Based on

            **Full Changelog**: [${{ github.repository }}@${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.VERSION_TAG }}](https://github.com/${{ github.repository }}/compare/${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.VERSION_TAG }})

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `Houri-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`
          files: |
            Houri-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-nomtl-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-nomtl-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Houri-nomtl-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Announce release on Discord
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - release-app
    environment: Primary
    timeout-minutes: 10
    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.RELEASE_DISCORD_WEBHOOK }}
          VERSION_TAG: ${{ needs.prepare-build.outputs.VERSION_TAG }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-build.outputs.VERSION_TAG }}
          AVATAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/master/.github/readme-images/app-icon.png
          CHANGELOG: ${{ needs.prepare-build.outputs.COMMIT_LOGS }}
          PREV_TAG_NAME: ${{ needs.prepare-build.outputs.PREV_TAG_NAME }}
          TODO_COMPLETED: ${{ needs.prepare-build.outputs.TODO_COMPLETED }}
          TODO_OPEN: ${{ needs.prepare-build.outputs.TODO_OPEN }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "RELEASE_DISCORD_WEBHOOK not set; skipping Discord announcement."
            exit 0
          fi

          version_number="${VERSION_TAG#v}"

          # Keep at least one bullet; trim the rest to stay under Discord's 2000-char content limit.
          changes=$(printf '%s\n' "${CHANGELOG:-}" | awk '
            {
              if (over) { hidden++; next }
              total += length($0) + 1
              if (total > 1650 && shown >= 1) { over = 1; hidden++; next }
              print; shown++
            }
            END { if (hidden > 0) printf "- *…and %d more*\n", hidden }
          ')
          [ -n "$changes" ] || changes="- No notable changes"

          content=$(printf '# 🍍 Houri %s is out!\n\n### **What changed:**\n\n%s\n\ndetails can be found [here](%s)\n-# ||<@&1540511662824759336>||' \
            "$version_number" "$changes" "$RELEASE_URL")

          payload=$(jq -n \
            --arg content "$content" \
            --arg avatar_url "$AVATAR_URL" \
            --arg prev_tag "$PREV_TAG_NAME" \
            --arg todo_url "https://github.com/${{ github.repository }}/blob/master/TODO.md" \
            --arg completed "$TODO_COMPLETED" \
            --arg open "$TODO_OPEN" \
            '{
              username: "Houri Releases",
              avatar_url: $avatar_url,
              content: $content,
              allowed_mentions: { parse: [], roles: ["1540511662824759336"] }
            }
            | ([ (if ($completed|length) > 0
                  then { name: "✅ Checked off", value: $completed }
                  else empty end),
                 (if ($open|length) > 0
                  then { name: "📋 Still open", value: $open }
                  else empty end) ]) as $fields
            | if ($fields|length) > 0
              then . + { embeds: [{
                    title: ("📋 TODO progress since " + $prev_tag),
                    url: $todo_url,
                    color: (if ($open|length) == 0 then 5763719 else 15714844 end),
                    fields: $fields
                  }] }
              else . end')

          echo "$payload"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Houri-Release-Notifier/1.0 (GitHub Actions)' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
          echo "Discord announcement sent."
