name: Benchmark Builder
# Manually build a benchmark on a tag

on:
  # Dispatch or Manual triggers
  workflow_dispatch:
    inputs:
      clear-native-cache:
        description: 'Bust native .cxx cache (poisoned empty meson arg / chmod)'
        required: false
        default: false
        type: boolean

#  push:
#    branches:
#      - dev-benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: 'ubuntu-24.04'
    outputs:
      VERSION_TAG: ${{ steps.get_tag.outputs.VERSION_TAG }}
      ARTIFACTS_PREFIX: mtl/benchmark/app-mtl
      TAG_NAME: benchmark-${{ steps.tag_name.outputs.TAG_NAME }}
    steps:
      - name: Get tag name (${{ github.ref }})
        id: get_tag
        run: |
          version_tag=$(echo "${GITHUB_REF}" | sed -r 's|^refs/(heads|tags)/||' | sed -r 's/[-\/]+/_/g')
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT

      - name: Clone Repository (${{ steps.get_tag.outputs.VERSION_TAG }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Prepare env
        id: prepare_env
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT

      - name: Tag name
        id: tag_name
        run: |
          if [ "${{ steps.get_tag.outputs.VERSION_TAG }}" = "master" ]; then
            tag_name=${{ steps.get_tag.outputs.VERSION_TAG }}-r${{ steps.prepare_env.outputs.COMMIT_COUNT }}
            else
            tag_name=${{ steps.get_tag.outputs.VERSION_TAG }}
          fi

          echo "TAG_NAME=$tag_name"
          echo "TAG_NAME=$tag_name" >> $GITHUB_OUTPUT

  build-app:
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    steps:
      - name: Clone Repository (${{ needs.prepare-build.outputs.TAG_NAME }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The engine submodule (yakuyomi-engine) is required to compile, not
          # just prepare-build's metadata — without it the benchmark build fails.
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build_benchmark.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config meson ninja-build cmake python3 python3-pip nasm gperf libltdl-dev libglib2.0-dev texinfo ccache
          cmake --version
          meson --version
          ninja --version
          pkg-config --version
          nasm --version
          ccache --version

      - name: Install Android SDK CMake 3.22.1
        run: |
          echo "Installing cmake 3.22.1 via sdkmanager..."
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -f "$SDKMGR" ]; then SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1); fi
          if [ -f "$SDKMGR" ]; then
            echo "Found sdkmanager at $SDKMGR"
            yes | "$SDKMGR" --install "cmake;3.22.1" || yes | sudo "$SDKMGR" --install "cmake;3.22.1" || echo "sdkmanager install failed, will try alternative"
            "$SDKMGR" --list | grep cmake || true
          else
            echo "sdkmanager not found, searching SDK..."
            ls -R "$ANDROID_HOME" 2>/dev/null | head -n 50 || true
            ls -R "$ANDROID_SDK_ROOT" 2>/dev/null | head -n 50 || true
          fi
          ls -d "$ANDROID_HOME/cmake/3.22.1" 2>/dev/null && echo "cmake 3.22.1 installed" || echo "cmake dir not found, checking alternatives"
          ls -d "$ANDROID_SDK_ROOT/cmake/3.22.1" 2>/dev/null && echo "cmake 3.22.1 installed (SDK_ROOT)" || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('external/imagedecoder-houri/library/src/main/cpp/**', 'gradle/libs.versions.toml') }}
          max-size: 2G
          verbose: 1

      - name: Clean stale native cache (bust poisoned .cxx)
        run: |
          echo "Checking for poisoned native cache..."
          if [ "${{ inputs.clear-native-cache }}" == "true" ]; then
              echo "Manual bust requested via workflow_dispatch, removing .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            elif [ -d "external/imagedecoder-houri/library/.cxx" ]; then
            if grep -rq 'meson ""' external/imagedecoder-houri/library/.cxx 2>/dev/null; then
              echo "Detected stale empty meson arg, removing .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            fi
            if grep -rq 'cross-file=$' external/imagedecoder-houri/library/.cxx 2>/dev/null; then
              echo "Empty cross-file detected, cleaning .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            fi
          fi

      - name: Cache native build (.cxx only, exact match)
        uses: actions/cache@v4
        with:
          path: external/imagedecoder-houri/library/.cxx
          key: ${{ runner.os }}-native-${{ hashFiles('external/imagedecoder-houri/library/src/main/cpp/CMakeLists.txt', 'external/imagedecoder-houri/library/src/main/cpp/cmake/**', 'gradle/libs.versions.toml', 'external/imagedecoder-houri/**') }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success
          addJobSummary: onFailure

      - name: Check code format
        run: ./gradlew spotlessCheck --build-cache

      - name: Build app
        run: ./gradlew assembleMtlBenchmark --build-cache --parallel
        env:
          CCACHE_DIR: /home/runner/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --build-cache --parallel

      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/mtl/benchmark
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Get SHA & clean up build artifacts
        id: get_sha
        run: |
          set -e
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-universal-benchmark-signed.apk Houri-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-arm64-v8a-benchmark-signed.apk Houri-arm64-v8a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-armeabi-v7a-benchmark-signed.apk Houri-armeabi-v7a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-x86-benchmark-signed.apk Houri-x86-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-x86_64-benchmark-signed.apk Houri-x86_64-${{ needs.prepare-build.outputs.TAG_NAME }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 30
