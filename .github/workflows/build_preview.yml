name: Preview Builder
# Manually build a preview on master

on:
  # Dispatch or Manual triggers
  workflow_dispatch:

#  push:
#    branches:
#      - master
#    paths:
#      - '**'
#      - '!**.md'
#      - '!.github/**'
#      - '.github/scripts/**'
#      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    outputs:
      VERSION_TAG: ${{ steps.get_tag.outputs.VERSION_TAG }}
      CURRENT_SHA: ${{ steps.current_commit.outputs.CURRENT_SHA }}
      PREV_RELEASE_SHA: ${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}
      COMMIT_LOGS: ${{ steps.commit_logs.outputs.COMMIT_LOGS }}
      ARTIFACTS_PREFIX: ${{ steps.prepare_env.outputs.ARTIFACTS_PREFIX }}
      BUILD_TYPE_NAME: ${{ steps.prepare_env.outputs.BUILD_TYPE_NAME }}
      TAG_NAME: ${{ steps.prepare_env.outputs.TAG_NAME }}
      PREV_TAG_NAME: ${{ steps.previous_commit.outputs.PREV_TAG_NAME }}
    steps:
      - name: Get tag name (${{ github.ref }})
        id: get_tag
        run: |
          version_tag=$(echo "${GITHUB_REF}" | sed -r 's|^refs/(heads|tags)/||' | sed -r 's/[-\/]+/_/g')
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT

      - name: Clone Repository (${{ steps.get_tag.outputs.VERSION_TAG }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Get previous release
        id: last_release
        uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
        with:
          myToken: ${{ github.token }}
          exclude_types: "draft"
          view_top: 1

      - name: Curren commit
        id: current_commit
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse --short HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          echo "CURRENT_SHA=$current_sha"
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_OUTPUT

      - name: Previous commit
        id: previous_commit
        run: |
          set -e
          tag="${{ steps.last_release.outputs.tag_name }}"
          if [ -z "$tag" ]; then
            echo "No previous release found; using root commit as base"
            commit_count_diff=$(git rev-list --count HEAD)
            commit_count_diff=$((commit_count_diff > 0 ? commit_count_diff - 1 : 1))
            prev_release_sha=$(git rev-list --max-parents=0 HEAD | head -n1 | xargs git rev-parse --short)
          else
            commit_count_diff=$(git rev-list --count "$tag"..HEAD || echo 1)
            if [ -z "$commit_count_diff" ] || [ "$commit_count_diff" -eq 0 ]; then
              commit_count_diff=1
            fi
            # Clamp to not exceed total commits
            total=$(git rev-list --count HEAD)
            if [ "$commit_count_diff" -ge "$total" ]; then
              prev_release_sha=$(git rev-list --max-parents=0 HEAD | head -n1 | xargs git rev-parse --short)
            else
              prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
            fi
          fi
          echo "commit_count_diff=$commit_count_diff"
          echo "PREV_RELEASE_SHA=$prev_release_sha"
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_OUTPUT
          echo "PREV_TAG_NAME=$tag"
          echo "PREV_TAG_NAME=$tag" >> $GITHUB_OUTPUT

      - name: Prepare env
        id: prepare_env
        run: |
          tag_prefix=r
          artifacts_prefix=preview/app
          build_type_name=Preview

          echo "TAG_NAME=${tag_prefix}${{ steps.current_commit.outputs.COMMIT_COUNT }}"
          echo "TAG_NAME=${tag_prefix}${{ steps.current_commit.outputs.COMMIT_COUNT }}" >> $GITHUB_OUTPUT
          echo "ARTIFACTS_PREFIX=$artifacts_prefix"
          echo "ARTIFACTS_PREFIX=$artifacts_prefix" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE_NAME=$build_type_name"
          echo "BUILD_TYPE_NAME=$build_type_name" >> $GITHUB_OUTPUT

      - name: Create Tag '${{ steps.prepare_env.outputs.TAG_NAME }}'
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.prepare_env.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.prepare_env.outputs.TAG_NAME }} already exists, skipping"
          else
            git tag "${{ steps.prepare_env.outputs.TAG_NAME }}"
            git push origin "${{ steps.prepare_env.outputs.TAG_NAME }}"
            echo "New tag created: ${{ steps.prepare_env.outputs.TAG_NAME }}"
          fi

      - name: Commit logs
        id: commit_logs
        run: |
          # Skip commits that only touch TODO files so they don't flood release notes
          echo "COMMIT_LOGS<<{delimiter}
          $(git log --no-merges --pretty=format:"%H|%an|%s" "${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}..${{ steps.current_commit.outputs.CURRENT_SHA }}" \
            | while IFS='|' read -r hash author subject; do
                if git diff-tree --no-commit-id --name-only -r "$hash" < /dev/null | grep -qviE '^(todo\.md|docs/todo\.md)$'; then
                  printf -- "- %s (@%s)\n" "$subject" "$author"
                fi
              done)
          {delimiter}" >> $GITHUB_OUTPUT

  build-app:
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    environment: Primary
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 90
    steps:
      - name: Clone Repository (${{ needs.prepare-build.outputs.VERSION_TAG }} - ${{ needs.prepare-build.outputs.TAG_NAME }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printenv GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set; skipping"
          fi

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            printenv GOOGLE_CLIENT_SECRETS_JSON | base64 -d > app/src/main/assets/client_secrets.json
          else
            echo "GOOGLE_CLIENT_SECRETS_JSON not set; skipping"
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew assemblePreview -Pinclude-telemetry -Penable-updater

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

  release-app:
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Get SHA & clean up build artifacts
        id: get_sha
        run: |
          set -e

          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-universal-preview-signed.apk Houri-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-arm64-v8a-preview-signed.apk Houri-arm64-v8a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-armeabi-v7a-preview-signed.apk Houri-armeabi-v7a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-x86-preview-signed.apk Houri-x86-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          mv app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}-x86_64-preview-signed.apk Houri-x86_64-${{ needs.prepare-build.outputs.TAG_NAME }}.apk

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare-build.outputs.TAG_NAME }}
          name: Houri Preview ${{ needs.prepare-build.outputs.TAG_NAME }} (${{ needs.prepare-build.outputs.VERSION_TAG }})
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ needs.prepare-build.outputs.TAG_NAME }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/${{ github.repository }}/releases/${{ needs.prepare-build.outputs.TAG_NAME }})
            #### What's Changed
            ##### New

            ##### Improve

            ##### Fix

            ${{ needs.prepare-build.outputs.COMMIT_LOGS }}

            **Full Changelog**: [${{ github.repository }}@${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.TAG_NAME }}](https://github.com/${{ github.repository }}/compare/${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.TAG_NAME }})

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `Houri-${{ needs.prepare-build.outputs.TAG_NAME }}.apk`
          files: |
            Houri-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Houri-arm64-v8a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Houri-armeabi-v7a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Houri-x86-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Houri-x86_64-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          draft: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
