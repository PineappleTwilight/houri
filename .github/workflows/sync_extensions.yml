name: Sync Extensions Source

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    environment: Primary
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          token: ${{ secrets.EXTENSIONS_PAT }}

      - name: Add upstream remote
        working-directory: extensions-source
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions-source.git || true
          git fetch upstream main

      - name: Merge upstream changes
        working-directory: extensions-source
        run: |
          git checkout main
          git merge upstream/main --no-edit --strategy-option theirs || true

      - name: Push to fork
        working-directory: extensions-source
        run: |
          git push origin main

      - name: Commit updated submodule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions-source
          git diff --cached --quiet || git commit -m "chore: sync extensions-source with upstream"
          git push