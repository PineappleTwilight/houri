name: Sync Extensions Source

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Primary
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.EXTENSIONS_PAT }}

      - name: Add upstream remote
        working-directory: extensions-source
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions-source.git || true
          git fetch upstream main

      - name: Merge upstream changes
        working-directory: extensions-source
        run: |
          git checkout main
          git merge upstream/main --no-edit --strategy-option theirs || true

      - name: Push to fork
        working-directory: extensions-source
        run: |
          git push origin main

      - name: Commit updated submodule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions-source
          git diff --cached --quiet || git commit -m "chore: sync extensions-source with upstream"
          git push
