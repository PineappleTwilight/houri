name: TODO Discord Notifier

on:
  push:
    branches:
      - master
    # GitHub evaluates these against the whole push (the union of files changed
    # across every commit), so a multi-commit push touching TODO.md still triggers.
    # This keeps the notifier from burning a checkout + python run on every push
    # to master that has nothing to do with the todo list.
    paths:
      - 'TODO.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Must NOT cancel in-progress runs: each run reports the TODO.md delta of the
  # commit that triggered it, so cancelling one silently drops its report.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Report TODO changes
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the script can diff against github.event.before even
          # when a single push contains several commits touching TODO.md.
          fetch-depth: 0

      - name: Evaluate TODO.md changes and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.username }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/todo_discord_notify.py
