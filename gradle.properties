# TODO(perf): Flipping to android.nonTransitiveRClass=true improves build speed and R-class
#  size, but ~316 R.* references across 61 files (some hitting library-module resources)
#  need module-scoped R imports first. Evaluated during the 2026-08 refactor pass; declined
#  for churn-vs-benefit. Revisit when touching resource-heavy UI modules.
android.nonTransitiveRClass=false
android.useAndroidX=true
android.enableR8.fullMode=false

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
