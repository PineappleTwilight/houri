# TODO(perf): Flipping to android.nonTransitiveRClass=true improves build speed and R-class
#  size, but requires re-pointing every cross-module R reference to its owning module first.
#  Known blockers mapped during the 2026-08 audit (~30 files):
#   - 31x R.string.* resolve against moko-GENERATED res in i18n/i18n-kmk/i18n-sy (no on-disk res)
#   - ~180x R.drawable.<cc>/brand_*/ic_flag_* live in flagkit's module
#   - Theme_Tachiyomi_* style refs use dotted XML names vs underscore Kotlin names
#  Migration recipe: enumerate refs (grep '\bR\.(type)\.' ), locate owner module res,
#  qualify via owner R imports per file, then flip. Verify with :app:compileDebugKotlin.
android.nonTransitiveRClass=false
android.useAndroidX=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official

org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Workaround for PackageAndroidArtifact hang at 99% with large native libs + ABI splits.
# New ApkCreator (incremental) + limited workers avoids file-lock deadlock seen with
# legacy packaging + universal APK (42m hang on packageMtl/NomtlDebug).
android.useNewApkCreator=true
org.gradle.workers.max=4

# Silence Kotlin 2.2+ hierarchy + unused source set spam for pure-resource / no-test KMP modules
# (i18n, source-api, source-local). The default hierarchy creates commonTest/androidUnitTest
# which are never used (no test files) and explicit dependsOn breaks the template.
kotlin.mpp.applyDefaultHierarchyTemplate=false
